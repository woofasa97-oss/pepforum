version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Must exceed minimumReleaseAge in pnpm-workspace.yaml, or pnpm rejects the update.
    cooldown:
      default-days: 3
    open-pull-requests-limit: 10
    groups:
      next-react:
        patterns: ["next", "react", "react-dom", "eslint-config-next", "@types/react*"]
      supabase:
        patterns: ["@supabase/*"]
      tooling:
        patterns: ["typescript", "typescript-eslint", "eslint", "@eslint/*", "vitest", "@types/node", "globals"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
