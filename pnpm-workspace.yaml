packages:
  - apps/*
  - packages/*

# Supply-chain hardening: only these packages may run install scripts.
onlyBuiltDependencies:
  - sharp
  - supabase          # postinstall downloads the pinned CLI binary
  - unrs-resolver

# Don't resolve versions published less than a day ago (minutes). Pinned here so
# local installs, CI and Dependabot behave the same whatever the pnpm version.
minimumReleaseAge: 1440
